[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risklens"
version = "2.0.0"
description = "Transparent quantitative market and portfolio risk intelligence dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RiskLens contributors"}]
dependencies = [
  "streamlit==1.50.0",
  "plotly==6.5.2",
  "pandas==2.2.3",
  "numpy==2.3.5",
  "scipy==1.17.0",
  "statsmodels==0.14.6",
  "scikit-learn==1.8.0",
  "requests==2.32.5",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "python-dotenv==1.2.2"
]

[project.optional-dependencies]
market = ["yfinance==0.2.66", "feedparser==6.0.12"]
ai = ["google-genai>=1.0.0,<2.0", "transformers>=4.45,<6", "torch>=2.4,<3"]
dev = ["pytest==9.0.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
